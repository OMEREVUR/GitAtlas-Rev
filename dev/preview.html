<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitAtlas-RevRev önizleme</title>
<!-- YALNIZCA geliştirme: VS Code webview'ını taklit eder. Model scripts/preview.ts ile üretilir. -->
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="../dist/codicons/codicon.css">
<link rel="stylesheet" href="../dist/webview.css">
</head>
<body class="vscode-dark">
<div id="app"></div>
<script src="out/preview-model.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var theme = params.get('theme') === 'light' ? 'light' : 'dark';
  document.body.className = 'vscode-' + theme;
  // Kullanıcının F5 temasını taklit: çok koyu charts-orange ve panelle aynı ikincil düğme arka planı.
  if (params.get('usertheme') === '1') {
    document.documentElement.style.setProperty('--vscode-charts-orange', '#5C2E10');
    document.documentElement.style.setProperty('--vscode-button-secondaryBackground', '#202020');
    document.documentElement.style.setProperty('--vscode-editorWidget-background', '#202020');
    document.documentElement.style.setProperty('--vscode-sideBar-background', '#202020');
  }
  var auto = params.get('autoselect');
  if (auto === '1') document.body.dataset.autoselect = 'first-commit';
  else if (auto) document.body.dataset.autoselect = auto;
  // Headless Chrome pencereyi ~500px'in altına indirmiyor; dar paneli genişliği sınırlayarak taklit et.
  var width = Number(params.get('width'));
  if (width > 0) document.body.style.width = width + 'px';
  var model = window.__RR_PREVIEW__;
  var range = params.get('range') || '30d';
  var view = params.get('view');
  var state = view ? { view: view } : undefined;
  if (params.get('select')) state = Object.assign({}, state || {}, { selectedPath: params.get('select') });
  var timeback = Number(params.get('timeback'));
  if (timeback > 0 && model && model.timeline) state = Object.assign({}, state || {}, { timeAt: model.timeline.end - timeback * 864e5 });
  var gh = params.get('gh') || 'connected';
  if (params.get('tree') === '1') state = Object.assign({}, state || {}, { changesTree: true });
  var opdemo = params.get('opdemo') === '1';
  function githubData() {
    var d = model.github;
    if (gh === 'off') return { status: { state: 'off', dismissed: false }, pullRequests: [], branchCi: [] };
    if (gh === 'noRemote') return { status: { state: 'noRemote' }, pullRequests: [], branchCi: [] };
    if (gh === 'stale') return { status: { state: 'stale', repo: d.status.repo, fetchedAt: Date.now() - 3 * 3600e3, reason: 'sessionExpired' }, pullRequests: d.pullRequests, branchCi: d.branchCi };
    return d;
  }
  function send(msg) { window.postMessage(msg, '*'); }
  function sendModel() {
    send({ type: 'model', range: range, repoName: model.repoName, files: model.ranges[range], commits: model.commits });
  }
  window.acquireVsCodeApi = function () {
    return {
      getState: function () { return state; },
      setState: function (s) { state = s; },
      postMessage: function (msg) {
        console.log('[webview → eklenti]', JSON.stringify(msg));
        if (!model) { send({ type: 'error', code: 'unknown', message: 'dev/out/preview-model.js yok: npm run preview -- <repo> çalıştır.' }); return; }
        if (msg.type === 'ready' || msg.type === 'refresh') {
          send({ type: 'loading', progress: 0.5 });
          setTimeout(function () { sendModel(); if (model.github) send({ type: 'github', data: githubData() }); }, 50);
        }
        else if (msg.type === 'loadStatus') {
          setTimeout(function () {
            send({ type: 'status', status: model.status });
            send({ type: 'stashes', stashes: model.stashes || [] });
            if (opdemo) {
              send({ type: 'opStarted', id: 'demo', kind: 'push', commands: ['git push -u origin feature/graph'] });
              setTimeout(function () {
                send({ type: 'opResult', result: { id: 'demo', kind: 'push', ok: false, commands: ['git push -u origin feature/graph'], message: 'Gönderilemedi: uzakta yeni commit\'ler var; önce Çek (pull) yapın.', detail: ' ! [rejected]        feature/graph -> feature/graph (fetch first)\nerror: failed to push some refs' } });
              }, 40);
            }
          }, 30);
        }
        else if (msg.type === 'loadPrPanel') {
          setTimeout(function () {
            if (gh === 'off' || gh === 'noRemote') { send({ type: 'prPanel', data: undefined }); return; }
            var prs = (model.github.pullRequests || []).map(function (p, i) {
              return Object.assign({}, p, {
                body: '', mergeable: i === 1 ? 'conflicting' : 'mergeable',
                reviewDecision: i === 0 ? 'approved' : 'reviewRequired', reviewRequested: i === 2,
                isCrossRepository: false, additions: 12 + i, deletions: 3, changedFiles: p.files.length,
                checks: [{ name: 'build', state: p.ci }, { name: 'test', state: 'success' }]
              });
            });
            var branch = model.status && model.status.branch;
            send({ type: 'prPanel', data: {
              viewer: 'ornek', defaultBranch: 'main', mergeMethods: ['merge', 'squash', 'rebase'],
              currentBranchPr: prs.filter(function (p) { return p.headRef === branch; })[0],
              mine: prs.slice(0, 2), reviewRequested: prs.slice(2), fetchedAt: Date.now() - 60000 } });
          }, 30);
        }
        else if (msg.type === 'loadPrDraft') {
          setTimeout(function () {
            send({ type: 'prDraft', draft: { head: (model.status && model.status.branch) || 'feature/x', base: msg.base || 'main', title: 'Graph kenarlari', body: '## Değişiklikler\n- feat: graph iskeleti\n- feat: graph şeritleri', commits: 2, needsPush: true } });
          }, 30);
        }
        else if (msg.type === 'githubOp') {
          send({ type: 'opStarted', id: msg.id, kind: msg.op.kind, commands: ['(önizleme) ' + msg.op.kind] });
          setTimeout(function () { send({ type: 'opResult', result: { id: msg.id, kind: msg.op.kind, ok: true, commands: [], message: 'Önizleme: işlem çalıştırılmadı.' } }); }, 30);
        }
        else if (msg.type === 'gitOp') {
          send({ type: 'opStarted', id: msg.id, kind: msg.op.kind, commands: ['(önizleme) ' + msg.op.kind] });
          setTimeout(function () { send({ type: 'opResult', result: { id: msg.id, kind: msg.op.kind, ok: true, commands: [], message: 'Önizleme: işlem çalıştırılmadı.' } }); }, 30);
        }
        else if (msg.type === 'loadTimeline') { setTimeout(function () { send({ type: 'timeline', timeline: model.timeline }); }, 30); }
        else if (msg.type === 'loadContrib') { setTimeout(function () { send({ type: 'contrib', contrib: model.contribs[msg.range] }); }, 30); }
        else if (msg.type === 'setRange') { range = msg.range; sendModel(); }
        else if (msg.type === 'loadGraph') {
          send({ type: 'graphLoading' });
          var g = model.graphs && model.graphs[msg.branch || ''];
          setTimeout(function () {
            if (g) send({ type: 'graph', graph: g });
            else send({ type: 'graphError', message: 'Önizlemede bu branch için graph yok.' });
          }, 30);
        }
      }
    };
  };
})();
</script>
<script src="../dist/webview.js"></script>
</body>
</html>
