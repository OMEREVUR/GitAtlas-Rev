<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitAtlas-Rev — bisect önizlemesi</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="out/bisect.entry.css">
  <style>
    /* Yalnızca önizleme düzeni. */
    body { container-type: inline-size; }
    .dev-page { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--vscode-sideBar-background); }
    #bisect { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; }
    .dev-log { flex: 0 0 160px; overflow: auto; padding: 6px 10px; font-size: 11px; font-family: var(--rr-mono); color: var(--vscode-descriptionForeground); border-top: 1px solid var(--vscode-panel-border); background: var(--vscode-editor-background); }
  </style>
</head>
<body class="vscode-dark">
  <div class="dev-page">
    <section id="bisect"></section>
    <div id="log" class="dev-log" aria-live="polite" aria-label="Gönderilen işlemler"></div>
  </div>
  <script src="out/bisect.entry.js"></script>
</body>
</html>
