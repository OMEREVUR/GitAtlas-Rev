<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RewiewRev — graph araç çubuğu + seçim ayrıntısı</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="out/graphside.entry.css">
  <style>
    /* Yalnızca önizleme düzeni. */
    body { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
    #toolbar { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid var(--vscode-panel-border); }
    .dev-main { flex: 1 1 auto; min-height: 0; display: flex; }
    #list { flex: 1 1 auto; min-width: 0; overflow: auto; padding: 6px 0; background: var(--vscode-editor-background); }
    .dev-row { display: block; width: 100%; height: 22px; padding: 0 12px; border: 0; background: none; text-align: left; font-family: var(--vscode-editor-font-family); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .dev-row:hover { background: var(--vscode-list-hoverBackground); }
    #detail { flex: 0 0 320px; }
    #log { flex: 0 0 110px; overflow: auto; padding: 6px 12px; border-top: 1px solid var(--vscode-panel-border); font-family: var(--vscode-editor-font-family); font-size: 11px; color: var(--vscode-descriptionForeground); }
    body.dev-narrow #list { display: none; }
    body.dev-narrow #detail { flex: 1 1 auto; border-left: 0; }
  </style>
</head>
<body class="vscode-dark">
  <div id="toolbar"></div>
  <div class="dev-main">
    <div id="list" aria-label="Sahte graph listesi"></div>
    <aside id="detail" aria-label="Seçim ayrıntısı"></aside>
  </div>
  <div id="log"></div>
  <script src="out/graphside.entry.js"></script>
</body>
</html>
