<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RewiewRev — zaman makinesi önizlemesi</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="out/timemachine.entry.css">
  <style>
    /* Yalnızca önizleme düzeni. */
    .dev-page { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
    .dev-log { padding: 4px 16px; min-height: 16px; font-size: 11px; color: var(--vscode-descriptionForeground); font-family: var(--rr-mono); border-bottom: 1px solid var(--vscode-panel-border); }
    #tm { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body class="vscode-dark">
  <div class="dev-page">
    <div id="log" class="dev-log" aria-live="polite"></div>
    <div id="tm"></div>
  </div>
  <script src="out/timemachine.entry.js"></script>
</body>
</html>
