name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run vscode:prepublish
      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @vscode/vsce package --no-dependencies --skip-license -o gitatlas-rev.vsix
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: gitatlas-rev-vsix
          path: gitatlas-rev.vsix
